name: A03 systemic integration

on:
  push:
    branches:
      - feature/a03-madame-prologue
    paths:
      - '.github/workflows/a03-audit.yml'
      - '.a03-payload/**'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble source and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import zlib

          source = ''.join(path.read_text(encoding='ascii') for path in sorted(Path('.a03-payload').glob('src-*.b64')))
          tests = Path('.a03-payload/test-00.b64').read_text(encoding='ascii')
          outputs = {
              Path('src/v050/10b_a03_madame.js'): zlib.decompress(base64.b64decode(source)),
              Path('tests/expansion/lore_a03_madame.cjs'): zlib.decompress(base64.b64decode(tests)),
          }
          for path, data in outputs.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print(f'wrote {path} ({len(data)} bytes)')
          PY
      - name: Validate module and model
        run: |
          node --check src/v050/10b_a03_madame.js
          node --test tests/expansion/lore_a03_madame.cjs
      - name: Commit integration and remove staging files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v050/10b_a03_madame.js tests/expansion/lore_a03_madame.cjs
          git rm -r .a03-payload .github/workflows/a03-audit.yml
          git commit -m 'feat(a03): add M.A.D.A.M.E. and seven-network registry'
          git push origin HEAD:feature/a03-madame-prologue
