name: Review bible against existing bestiary
on:
  push:
    branches: [feature/bible-cour-sync]
    paths: ['delivery/bible-review.py', '.github/workflows/import-bible-cour.yml']
permissions:
  contents: write
concurrency:
  group: import-bible-cour-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clarify existing implementation and navigation into bible
        run: python delivery/bible-review.py
      - name: Repeat logic and documentary tests without modifying game
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/expansion/lore_*.cjs | tee /tmp/bible-review-lore.log
          python -m unittest discover -s tests/expansion -p 'test_lore_registry.py' -v 2>&1 | tee /tmp/bible-review-tests.log
          python tools/build_single.py --check
          python tools/verify_lore_registry.py --bundle src/game.js --output verification/bible-sync/REGISTRY.json
      - name: Record final documentation and unchanged tested program
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path('verification/bible-sync');qa=json.loads((root/'QA.json').read_text())
          for name,h in qa['canonical_outputs'].items():
            assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==h,name
          log=pathlib.Path('/tmp/bible-review-lore.log').read_text();assert re.search(r'^# pass 727$',log,re.M) and re.search(r'^# fail 0$',log,re.M)
          log=pathlib.Path('/tmp/bible-review-tests.log').read_text();assert 'Ran 19 tests' in log and '\nOK\n' in log
          reg=json.loads((root/'REGISTRY.json').read_text());assert reg['ok']
          changed=['README.md','docs/BIBLE_LORE_FALLOUT_MISTRAL.md','docs/AUDIT_BIBLE_2026_11_11.md']
          review={'run':int(os.environ['GITHUB_RUN_ID']),'input_commit':os.environ['GITHUB_SHA'],'lore_tests_repeated':727,'registry_tests_repeated':19,'canonical_game_unchanged':True,'registry':reg,'changes':{'README.md':'Current central bible, index, registry, gaps and evidence accessible from repository home.','docs/BIBLE_LORE_FALLOUT_MISTRAL.md':'Rat-couronne existing giantRat rig is not classified as entirely absent; aggregate representation remains open.','docs/AUDIT_BIBLE_2026_11_11.md':'Source of the bestiary qualification and exact scope of the narrative registry.'},'sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in changed},'limits':'Documentary clarification only. Browser and cold-restart evidence belongs to the unchanged program and its earlier completed validation run.'}
          (root/'DOCUMENTATION_REVIEW.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')
          qa['registry_at_game_validation']=qa['registry'];qa['registry']=reg
          qa['documentation_review']={k:v for k,v in review.items() if k!='registry'}
          (root/'QA.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'run':review['run'],'registry_ok':reg['ok'],'entries':reg['entries'],'modules':reg['narrative_modules'],'chapters':reg['chapters'],'game_unchanged':True},indent=2))
          PY
      - name: Reviewed documents and current evidence
        uses: actions/upload-artifact@v4
        with:
          name: mistral-bible-review-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            README.md
            LORE.md
            docs/BIBLE_LORE_FALLOUT_MISTRAL.md
            docs/AUDIT_BIBLE_2026_11_11.md
            docs/REGISTRE_LORE.json
            verification/bible-sync/QA.json
            verification/bible-sync/REGISTRY.json
            verification/bible-sync/DOCUMENTATION_REVIEW.json
      - name: Commit verified documentation only
        run: |
          remote_head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/BIBLE_LORE_FALLOUT_MISTRAL.md docs/AUDIT_BIBLE_2026_11_11.md verification/bible-sync/QA.json verification/bible-sync/REGISTRY.json verification/bible-sync/DOCUMENTATION_REVIEW.json
          git rm -- delivery/bible-review.py
          test -z "$(git diff --cached --name-only -- src index.html JOUER_FALLOUT_MISTRAL_v0.50.html sw.js .github)"
          git commit -m 'docs(lore): acces direct a la bible et statut exact du Rat-couronne'
          git push origin HEAD:${GITHUB_REF_NAME}
