name: Publish verified consignment gestures
on:
  push:
    branches: [feature/lore-consigne-gestes-import]
    paths: ['delivery/consigne-gestes-import/**', '.github/workflows/import-consigne-gestes.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: import-consigne-gestes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish-verified:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve exact previously validated artifact
        uses: actions/download-artifact@v4
        with:
          name: fallout-mistral-gestes-03934d945b78eaa2eb8c578f9eda6e10a65fdc88
          run-id: 42917085993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/gestes-canonical
      - name: Apply verified source patch without changing workflow files
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path('delivery/consigne-gestes-import')
          meta=json.loads((root/'meta.json').read_text())
          parts=sorted(root.glob('part*.b64'));assert len(parts)==3
          raw=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          assert len(raw)==14592 and hashlib.sha256(raw).hexdigest()==meta['compressed_sha256']
          patch=lzma.decompress(raw,memlimit=256*1024*1024)
          assert len(patch)==42885 and hashlib.sha256(patch).hexdigest()==meta['patch_sha256']
          for name,expected in meta['preimages'].items():
            p=pathlib.Path(name)
            assert (not p.exists()) if expected is None else (hashlib.sha256(p.read_bytes()).hexdigest()==expected),name
          p=pathlib.Path('/tmp/consigne-gestes.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(changed)==set(meta['preimages']),changed
          for name,expected in meta['postimages'].items():
            assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,name
            if not name.startswith('.github/'):
              assert pathlib.Path(name).read_bytes()==(pathlib.Path('/tmp/gestes-canonical')/name).read_bytes(),name
          subprocess.run(['git','restore','--source=HEAD','--staged','--worktree','.github/workflows/lore-regression.yml'],check=True)
          assert not subprocess.check_output(['git','diff','--cached','--name-only','--','.github'],text=True).strip()
          PY
      - name: Rebuild exact game and repeat logic regressions
        shell: bash
        run: |
          set -euo pipefail
          for source in src/v050/10*.js; do node --check "$source"; done
          node --test tests/expansion/lore_*.cjs | tee /tmp/gestes-lore.log
          python3 tools/build_single.py
          python3 tools/build_single.py --check
          node --check src/game.js
          node tests/expansion/city_streaming.cjs
          node tests/expansion/city_wait_cancel.test.cjs
          node tests/expansion/city_partition_seams.test.cjs
          node tests/expansion/city_geometry_identity.test.cjs
      - name: Verify canonical identity and retain actual validation provenance
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,re,shutil
          canonical=pathlib.Path('/tmp/gestes-canonical')
          source=canonical/'verification/gestes/QA.json'
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='19a82830e7c7113134d0ee541325a5c751782abac324c8ce27337cf6577c24a4'
          qa=json.loads(source.read_text())
          assert qa['canonical_ci']['run']==42917085993 and qa['canonical_ci']['lore_passed']==651 and qa['regular_browser_checks']==873
          assert qa['canonical_outputs']['index.html']=='8b90aea815826c0442c9742b6279c144043b1db99ef954d967621a054713e677'
          for name,expected in qa['canonical_outputs'].items():
            actual=pathlib.Path(name).read_bytes()
            assert hashlib.sha256(actual).hexdigest()==expected,name
            assert actual==(canonical/name).read_bytes(),name
          log=pathlib.Path('/tmp/gestes-lore.log').read_text()
          assert re.search(r'^# pass 651$',log,re.M) and re.search(r'^# fail 0$',log,re.M)
          shutil.copyfile(source,'verification/gestes/QA.json')
          publication={'validation_run':42917085993,'validation_job':130182194919,'validation_result':'651 logic tests, 873 regular browser checks, 65 bird and 26 rat cold restart checks succeeded','validation_run_overall_result':'failure at source publication only: workflow write permission refused','program_artifact':13809798068,'evidence_artifact':13810707308,'publication_run':int(os.environ['GITHUB_RUN_ID']),'publication_input':os.environ['GITHUB_SHA'],'canonical_outputs_byte_identical':True,'logic_tests_repeated':651,'workflow_files_changed_by_bot':False,'note':'Game content is published separately from workflow cleanup. No main merge or deployment.'}
          pathlib.Path('verification/gestes/PUBLICATION_RECOVERY.json').write_text(json.dumps(publication,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(publication,ensure_ascii=False,indent=2))
          PY
      - name: Publish source and generated game only
        run: |
          remote_head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo 'Branch advanced: refusing to overwrite newer work.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js index.html JOUER_FALLOUT_MISTRAL_v0.50.html sw.js verification/gestes/QA.json verification/gestes/PUBLICATION_RECOVERY.json
          git rm -- delivery/consigne-gestes-import/part0.b64 delivery/consigne-gestes-import/part1.b64 delivery/consigne-gestes-import/part2.b64 delivery/consigne-gestes-import/meta.json
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --stat
          git commit -m 'feat(lore): gestes des propriétaires et objets conservés après restitution'
          git push origin HEAD:${GITHUB_REF_NAME}
