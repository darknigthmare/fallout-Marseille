name: Import verified consignment reunions
on:
  push:
    branches: [feature/lore-retrouvailles-import]
    paths: ['delivery/retrouvailles-import/**', '.github/workflows/import-retrouvailles.yml']
permissions:
  contents: write
concurrency:
  group: import-retrouvailles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  import-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source preimages and apply patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          root=pathlib.Path('delivery/retrouvailles-import')
          parts=sorted(root.glob('part*.b64'))
          assert len(parts)==2
          raw=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          assert len(raw)==16204
          assert hashlib.sha256(raw).hexdigest()=='b24399ecf7c9364b762db4421f5c58e9ea9ec4118cd6c288240d7cf6b0cbb134'
          patch=lzma.decompress(raw,memlimit=256*1024*1024)
          assert len(patch)==52651
          assert hashlib.sha256(patch).hexdigest()=='2efffe7d296e5a8f974c02a1e0cdd27b874e476b1e6343030d156cc46ed9e7c8'
          preimages={
           'src/v050/10t_gabians_consigne.js':'793a19918a33174b5cd8223ec9851db0d387694366db1d9b9f37deebe25b2f86',
           'src/v050/10u_gabians_runtime.js':'10e3b6032f5931af3afbe812b7e0753fe497544622d81d7f9dd08e26bddbb795',
           'tests/expansion/lore_gabians_consigne.cjs':'0cfb36ea5296437ad8b95bcc503f966fb3143785a73e043a96dfe40f6d50fe43',
           'tests/expansion/retrouvailles_browser_smoke.py':None,
           'tests/expansion/birds_cold_save_smoke.py':None,
           'LORE.md':'058252dddf831d95e1f9a2c822f38c463e4e751dfe7ef98067b474117bea8b05',
           'docs/BIBLE_LORE_FALLOUT_MISTRAL.md':'ce7a1a0a28cc1e5929be7b0ed09a8547c205a2084606294c0f03ef623f973499',
           'docs/ETAT_LORE_MANQUANTS.md':'0dd1f9a9815c26eec54fc6fe55187496981e7664e00faa1378d050e255ddf945',
           'docs/LORE_GABIANS_OBJETS_TROUVES.md':'cfeccd6012b26dc4f6697561353934fd0f9ef533ef6af1eb961f1f1c39344d2d',
           'docs/LORE_GABIANS_RESTITUTIONS.md':None,
           'verification/retrouvailles/QA_LOCAL.json':None
          }
          for name,expected in preimages.items():
           p=pathlib.Path(name)
           assert (not p.exists()) if expected is None else (hashlib.sha256(p.read_bytes()).hexdigest()==expected),name
          target=pathlib.Path('/tmp/mistral-retrouvailles.patch');target.write_bytes(patch)
          subprocess.run(['git','apply','--unidiff-zero','--check',str(target)],check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index',str(target)],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(changed)==set(preimages),changed
          PY
      - name: Apply reviewed identity and documentation corrections
        run: |
          python delivery/retrouvailles-import/review.py
          git add src/v050/10u_gabians_runtime.js tests/expansion/retrouvailles_browser_smoke.py docs/ETAT_LORE_MANQUANTS.md docs/BIBLE_LORE_FALLOUT_MISTRAL.md docs/LORE_PIGEONS_POSTE_RESTANTE.md
      - name: Syntax and all lore tests
        run: |
          for source in src/v050/10*.js; do node --check "$source"; done
          python -m py_compile tests/expansion/birds_cold_save_smoke.py tests/expansion/retrouvailles_browser_smoke.py
          node --test tests/expansion/lore_*.cjs
      - name: Canonical compilation and deterministic output check
        run: |
          python3 tools/build_single.py
          python3 tools/build_single.py --check
          node --check src/game.js
          grep -q 'DE MAIN EN MAIN' src/game.js
          sha256sum index.html src/game.js sw.js
      - name: Four territory regressions
        run: |
          node tests/expansion/city_streaming.cjs
          node tests/expansion/city_wait_cancel.test.cjs
          node tests/expansion/city_partition_seams.test.cjs
          node tests/expansion/city_geometry_identity.test.cjs
      - name: Isolated browser environment
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Six genuine disk-backed bird restarts
        run: python tests/expansion/birds_cold_save_smoke.py --html index.html --output verification/retrouvailles/ci/birds-cold
      - name: Historical rat disk-backed restart
        run: python tests/expansion/rats_cold_save_smoke.py --html index.html --output verification/retrouvailles/ci/rats-cold
      - name: Fifteen instrumented production browser scenarios
        run: |
          for suite in retrouvailles pigeons gabians rats cigales secours parts lys compagnons voisins notaires mutuelle radieuse poste pharmacie; do
            python "tests/expansion/${suite}_browser_smoke.py" --html index.html --output "verification/retrouvailles/ci/${suite}"
          done
      - name: Browser evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mistral-retrouvailles-evidence-${{ github.sha }}
          path: verification/retrouvailles/ci/
          if-no-files-found: ignore
          retention-days: 14
      - name: Canonical playable program and source delivery
        uses: actions/upload-artifact@v4
        with:
          name: fallout-mistral-retrouvailles-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            index.html
            JOUER_FALLOUT_MISTRAL_v0.50.html
            src/game.js
            sw.js
            LORE.md
            src/v050/10*.js
            src/v049/*.js
            src/v046/04_lore.js
            src/v042/00_catalog.js
            tests/expansion/lore_*.cjs
            tests/expansion/compagnons_fixture.cjs
            tests/expansion/*browser_smoke.py
            tests/expansion/*cold_save_smoke.py
            docs/LORE*.md
            docs/BIBLE_LORE_FALLOUT_MISTRAL.md
            docs/ETAT_LORE_MANQUANTS.md
            verification/retrouvailles/QA_LOCAL.json
      - name: Publish validated sources and generated game on isolated feature branch
        run: |
          remote_head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo 'Branch advanced: refusing to overwrite newer work.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js index.html JOUER_FALLOUT_MISTRAL_v0.50.html sw.js
          git rm -- delivery/retrouvailles-import/part00.b64 delivery/retrouvailles-import/part01.b64 delivery/retrouvailles-import/review.py
          git diff --cached --stat
          git commit -m 'feat(lore): retrouver les propriétaires et éprouver six reprises des oiseaux'
          git push origin HEAD:${GITHUB_REF_NAME}
