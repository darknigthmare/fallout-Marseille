name: Lore regression
on:
  pull_request:
    paths: ['LORE.md', 'README.md', 'docs/**', 'src/**', 'index.html', 'JOUER_FALLOUT_MISTRAL_v0.50.html', 'sw.js', 'tests/expansion/**', 'tools/build_single.py', 'tools/verify_lore_registry.py', 'tools/audit_regional_content.py', 'tools/regional_catalog_snapshot.cjs', 'tools/validate_arsenal.py', '.github/workflows/lore-regression.yml']
  push:
    branches: [main, 'feature/**']
    paths: ['LORE.md', 'README.md', 'docs/**', 'src/**', 'index.html', 'JOUER_FALLOUT_MISTRAL_v0.50.html', 'sw.js', 'tests/expansion/**', 'tools/build_single.py', 'tools/verify_lore_registry.py', 'tools/audit_regional_content.py', 'tools/regional_catalog_snapshot.cjs', 'tools/validate_arsenal.py', '.github/workflows/lore-regression.yml']
permissions:
  contents: read
concurrency:
  group: lore-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuser une livraison ou un inventaire perime avant reconstruction
        run: |
          python tools/build_single.py --check
          python tools/audit_regional_content.py --check
      - name: Installer le navigateur isole
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Lore, arsenal, bible, territoire, dix-huit parcours et reprises a froid
        run: python tools/validate_arsenal.py --cold --jobs 2 --output verification/arsenal/ci
      - name: Rapports et captures y compris en cas d echec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mistral-arsenal-browser-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            verification/arsenal/ci/
            verification/arsenal/QA.json
      - name: Programme canonique, sources et bible
        uses: actions/upload-artifact@v4
        with:
          name: fallout-mistral-arsenal-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            index.html
            JOUER_FALLOUT_MISTRAL_v0.50.html
            sw.js
            src/
            tools/
            tests/expansion/
            docs/
            LORE.md
            README.md
            AGENTS.md
            verification/arsenal/QA.json
            verification/arsenal/LIVRAISON.md
