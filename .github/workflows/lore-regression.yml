name: Lore regression

on:
  pull_request:
    paths:
      - 'LORE.md'
      - 'docs/BIBLE_LORE_FALLOUT_MISTRAL.md'
      - 'docs/MATRICE_INTEGRATION_LORE.md'
      - 'docs/LORE_SERVICES_PUBLICS.md'
      - 'docs/LORE_CONTINUITE.md'
      - 'src/v046/04_lore.js'
      - 'src/v050/10_lore_continuity.js'
      - 'src/v050/10a_lore_services.js'
      - 'tests/expansion/lore_*.cjs'
      - 'tools/build_single.py'
      - '.github/workflows/lore-regression.yml'
  push:
    branches:
      - main
      - feature/lore-bible-services
    paths:
      - 'LORE.md'
      - 'docs/BIBLE_LORE_FALLOUT_MISTRAL.md'
      - 'docs/MATRICE_INTEGRATION_LORE.md'
      - 'docs/LORE_SERVICES_PUBLICS.md'
      - 'src/v050/10a_lore_services.js'
      - 'tests/expansion/lore_services.cjs'
      - 'tools/build_single.py'
      - '.github/workflows/lore-regression.yml'

permissions:
  contents: write

jobs:
  lore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntaxe du nouveau module
        run: node --check src/v050/10a_lore_services.js
      - name: Tests de continuité du lore
        run: node --test tests/expansion/lore_continuity.cjs tests/expansion/lore_services.cjs
      - name: Reconstruction du jeu
        run: python3 tools/build_single.py
      - name: Vérification du bundle généré
        run: |
          node --check src/game.js
          python3 tools/build_single.py --check
      - name: Artefact jouable de la branche
        uses: actions/upload-artifact@v4
        with:
          name: fallout-mistral-lore-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            JOUER_FALLOUT_MISTRAL_v0.50.html
            src/game.js
            index.html
            sw.js
      - name: Synchroniser les sorties générées de la branche lore
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/lore-bible-services'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js JOUER_FALLOUT_MISTRAL_v0.50.html index.html sw.js
          if git diff --cached --quiet; then
            echo 'Les sorties générées sont déjà synchronisées.'
          else
            git commit -m 'build(lore): refresh generated game'
            git push origin HEAD:feature/lore-bible-services
          fi
