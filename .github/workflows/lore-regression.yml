name: Lore regression
on:
  pull_request:
    paths: ['LORE.md', 'docs/*LORE*', 'src/v046/04_lore.js', 'src/v050/10*.js', 'tests/expansion/lore_*.cjs', 'tests/expansion/compagnons_fixture.cjs', 'tests/expansion/*browser_smoke.py', 'tests/expansion/rats_cold_save_smoke.py', 'tools/build_single.py', '.github/workflows/lore-regression.yml']
  push:
    branches: [main, 'feature/**']
    paths: ['LORE.md', 'docs/*LORE*', 'src/v046/04_lore.js', 'src/v050/10*.js', 'tests/expansion/lore_*.cjs', 'tests/expansion/compagnons_fixture.cjs', 'tests/expansion/*browser_smoke.py', 'tests/expansion/rats_cold_save_smoke.py', 'tools/build_single.py', '.github/workflows/lore-regression.yml']
permissions:
  contents: write
concurrency:
  group: lore-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntaxe des modules de lore
        run: for source in src/v050/10*.js; do node --check "$source"; done
      - name: Tests de lore et des institutions
        run: node --test tests/expansion/lore_*.cjs
      - name: Reconstruction du jeu
        run: python3 tools/build_single.py
      - name: Vérification du bundle généré
        run: |
          node --check src/game.js
          python3 tools/build_single.py --check
          for model in MistralMadame MistralCouncil MistralPoste MistralPharmacy MistralRadieuse MistralRadieuse MistralMutuelle MistralNotaires MistralVoisins MistralDevoir MistralLys MistralParts MistralSecours MistralCigales MistralRats MistralGabians MistralPigeons; do grep -q "const $model" src/game.js; done
          grep -q 'LES DENTS DU RÉSEAU' JOUER_FALLOUT_MISTRAL_v0.50.html
          grep -q 'LA BONNE ADRESSE' JOUER_FALLOUT_MISTRAL_v0.50.html
      - name: Régressions du territoire sur le bundle reconstruit
        run: |
          node tests/expansion/city_streaming.cjs
          node tests/expansion/city_wait_cancel.test.cjs
          node tests/expansion/city_partition_seams.test.cjs
          node tests/expansion/city_geometry_identity.test.cjs
      - name: Installer le navigateur de vérification isolée
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Reprise à froid avec un véritable profil Chromium
        run: python tests/expansion/rats_cold_save_smoke.py --html index.html --output verification/rats/ci/cold
      - name: Quatorze parcours navigateur instrumentés
        run: |
          for suite in pigeons gabians rats cigales secours parts lys compagnons voisins notaires mutuelle radieuse poste pharmacie; do
            python "tests/expansion/${suite}_browser_smoke.py" --html index.html --output "verification/rats/ci/${suite}"
          done
      - name: Rapports et captures navigateur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mistral-oiseaux-browser-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: verification/rats/ci/
      - name: Artefact du jeu et des sources de lore
        uses: actions/upload-artifact@v4
        with:
          name: fallout-mistral-oiseaux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            JOUER_FALLOUT_MISTRAL_v0.50.html
            src/game.js
            index.html
            sw.js
            LORE.md
            src/v050/10*.js
            src/v042/00_catalog.js
            src/v046/04_lore.js
            src/v049/*.js
            tests/expansion/lore_*.cjs
            tests/expansion/compagnons_fixture.cjs
            tests/expansion/*browser_smoke.py
            tests/expansion/rats_cold_save_smoke.py
            docs/LORE*.md
            docs/ETAT_LORE_MANQUANTS.md
            docs/BIBLE_LORE_FALLOUT_MISTRAL.md
            verification/rats/ci/pigeons/
            verification/rats/ci/gabians/
            verification/rats/ci/rats/
            verification/rats/ci/cold/
            verification/pigeons/QA.json
            verification/pigeons/QA_LOCAL.json
      - name: Synchroniser les sorties générées de la branche
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        run: |
          remote_head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo 'La branche a avancé : aucune écriture sur une révision périmée.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js JOUER_FALLOUT_MISTRAL_v0.50.html index.html sw.js
          if git diff --cached --quiet; then
            echo 'Les sorties générées sont déjà synchronisées.'
          else
            git commit -m 'build(lore): refresh generated game'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
