name: Lore regression

on:
  pull_request:
    paths:
      - 'LORE.md'
      - 'docs/*LORE*'
      - 'src/v046/04_lore.js'
      - 'src/v050/10*.js'
      - 'tests/expansion/lore_*.cjs'
      - 'tests/expansion/*browser_smoke.py'
      - 'tools/build_single.py'
      - '.github/workflows/lore-regression.yml'
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'LORE.md'
      - 'docs/*LORE*'
      - 'src/v046/04_lore.js'
      - 'src/v050/10*.js'
      - 'tests/expansion/lore_*.cjs'
      - 'tests/expansion/*browser_smoke.py'
      - 'tools/build_single.py'
      - '.github/workflows/lore-regression.yml'

permissions:
  contents: write

concurrency:
  group: lore-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntaxe des modules de lore
        run: |
          node --check src/v050/10a_lore_services.js
          node --check src/v050/10b_a03_madame.js
          node --check src/v050/10c_conseil_regional.js
          node --check src/v050/10d_poste_restante.js
          node --check src/v050/10e_pharmacie_garde.js
          node --check src/v050/10f_cite_radieuse.js
          node --check src/v050/10g_mutuelle_phoceenne.js
      - name: Tests de lore et des institutions
        run: node --test tests/expansion/lore_continuity.cjs tests/expansion/lore_services.cjs tests/expansion/lore_a03_madame.cjs tests/expansion/lore_conseil_regional.cjs tests/expansion/lore_poste_restante.cjs tests/expansion/lore_pharmacie_garde.cjs tests/expansion/lore_cite_radieuse.cjs tests/expansion/lore_mutuelle_phoceenne.cjs
      - name: Reconstruction du jeu
        run: python3 tools/build_single.py
      - name: Vérification du bundle généré
        run: |
          node --check src/game.js
          python3 tools/build_single.py --check
          grep -q 'const MistralMadame=' src/game.js
          grep -q 'const MistralCouncil=' src/game.js
          grep -q 'const MistralPoste=' src/game.js
          grep -q 'const MistralPharmacy=' src/game.js
          grep -q 'const MistralRadieuse=' src/game.js
          grep -q 'const MistralMutuelle' src/game.js
          grep -q 'M.A.D.A.M.E. ET SEPT RÉSEAUX' JOUER_FALLOUT_MISTRAL_v0.50.html
          grep -q 'CONSEIL RÉGIONAL' JOUER_FALLOUT_MISTRAL_v0.50.html
          grep -q 'POSTE RESTANTE' JOUER_FALLOUT_MISTRAL_v0.50.html
          grep -q 'PHARMACIES DE GARDE' JOUER_FALLOUT_MISTRAL_v0.50.html
          grep -q 'CITÉ RADIEUSE' JOUER_FALLOUT_MISTRAL_v0.50.html
          grep -q 'MUTUELLE PHOCÉENNE' JOUER_FALLOUT_MISTRAL_v0.50.html
      - name: Régressions du territoire sur le bundle reconstruit
        run: |
          node tests/expansion/city_streaming.cjs
          node tests/expansion/city_wait_cancel.test.cjs
          node tests/expansion/city_partition_seams.test.cjs
          node tests/expansion/city_geometry_identity.test.cjs
      - name: Artefact du jeu et des sources de lore
        uses: actions/upload-artifact@v4
        with:
          name: fallout-mistral-mutuelle-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            JOUER_FALLOUT_MISTRAL_v0.50.html
            src/game.js
            index.html
            sw.js
            LORE.md
            src/v050/10d_poste_restante.js
            src/v050/10e_pharmacie_garde.js
            src/v050/10f_cite_radieuse.js
            src/v050/10g_mutuelle_phoceenne.js
            tests/expansion/lore_poste_restante.cjs
            tests/expansion/lore_pharmacie_garde.cjs
            tests/expansion/lore_cite_radieuse.cjs
            tests/expansion/lore_mutuelle_phoceenne.cjs
            tests/expansion/poste_browser_smoke.py
            tests/expansion/pharmacie_browser_smoke.py
            tests/expansion/radieuse_browser_smoke.py
            tests/expansion/mutuelle_browser_smoke.py
            docs/LORE_POSTE_RESTANTE.md
            docs/LORE_PHARMACIES_DE_GARDE.md
            docs/LORE_CITE_RADIEUSE.md
            docs/LORE_MUTUELLE_PHOCEENNE.md
      - name: Synchroniser les sorties générées de la branche
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        run: |
          remote_head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo 'La branche a avancé : aucune écriture sur une révision périmée.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js JOUER_FALLOUT_MISTRAL_v0.50.html index.html sw.js
          if git diff --cached --quiet; then
            echo 'Les sorties générées sont déjà synchronisées.'
          else
            git commit -m 'build(lore): refresh generated game'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
