name: Validate and publish regional arsenal
on:
  push:
    branches: [feature/arsenal-ateliers]
    paths: ['delivery/arsenal-import/**', '.github/workflows/import-arsenal.yml']
permissions:
  contents: write
concurrency:
  group: arsenal-import-${{ github.ref }}
  cancel-in-progress: true
jobs:
  arsenal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source patch and preimages
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          parts=sorted(pathlib.Path('delivery/arsenal-import').glob('part*.b64'))
          assert len(parts)==2
          raw=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          assert len(raw)==26324 and hashlib.sha256(raw).hexdigest()=='6f0c6721fe4379b182c24a4813cdd77d2caa01d6238a6a2a684d3a25295682b6'
          data=json.loads(lzma.decompress(raw,memlimit=256*1024*1024))
          assert data['base']=='580f432e32369a950bb7761f9441da9f063f521e'
          assert len(data['files'])==13
          for name,hashes in data['files'].items():
            p=pathlib.Path(name);assert not p.is_absolute() and '..' not in p.parts and not name.startswith('.github/')
            before=hashes['before']
            assert (not p.exists()) if before is None else hashlib.sha256(p.read_bytes()).hexdigest()==before,name
          patch=pathlib.Path('/tmp/arsenal.patch');patch.write_text(data['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(changed)==set(data['files']),changed
          for name,hashes in data['files'].items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==hashes['after'],name
          PY
      - name: Generate the source-linked documentary inventory
        run: python tools/audit_regional_content.py
      - name: Isolated browser environment
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Complete build, tests, eighteen browser suites and cold restarts
        run: python tools/validate_arsenal.py --cold --jobs 2 --output verification/arsenal/ci
      - name: Evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mistral-arsenal-evidence-${{ github.sha }}
          path: verification/arsenal/
          if-no-files-found: ignore
          retention-days: 14
      - name: Validated program, sources and bible
        uses: actions/upload-artifact@v4
        with:
          name: fallout-mistral-arsenal-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            index.html
            JOUER_FALLOUT_MISTRAL_v0.50.html
            sw.js
            src/
            tools/
            tests/expansion/
            docs/
            LORE.md
            README.md
            AGENTS.md
            verification/arsenal/QA.json
      - name: Publish validated game files only
        run: |
          remote_head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game.js index.html JOUER_FALLOUT_MISTRAL_v0.50.html sw.js docs/INVENTAIRE_ARSENAL_BESTIAIRE.json docs/INVENTAIRE_ARSENAL_BESTIAIRE.md verification/arsenal/QA.json
          git rm -- delivery/arsenal-import/part0.b64 delivery/arsenal-import/part1.b64
          test -z "$(git diff --cached --name-only -- .github)"
          git commit -m 'feat(lore): carnet des ateliers, profils regionaux et inventaire verifiable'
          git push origin HEAD:${GITHUB_REF_NAME}
