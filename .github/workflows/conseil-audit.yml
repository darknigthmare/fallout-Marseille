name: Council flow audit

on:
  push:
    branches:
      - feature/conseil-regional-final
    paths:
      - '.github/workflows/conseil-audit.yml'
      - 'src/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Extract M.A.D.A.M.E. API and integration hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path('src/v050/10b_a03_madame.js')
          text=path.read_text(encoding='utf-8')
          lines=text.splitlines()
          print(f'===== {path} · {len(lines)} lines · {len(text)} bytes =====')

          for i,line in enumerate(lines):
              if re.search(r'^(\s*)(const|function)\s+[A-Za-z0-9_]+|return\{|v059Madame|v027|V027_STATIONS|showEnding|talkMireille|saveGame|module\.exports|__MISTRAL_DEBUG',line):
                  print(f'{i+1:04d}: {line}')

          print('\n===== LAST 180 LINES =====')
          for i,line in enumerate(lines[-180:], start=max(1,len(lines)-179)):
              print(f'{i:04d}: {line}')

          print('\n===== PUBLIC MODEL SMOKE =====')
          PY
          node - <<'NODE'
          const M=require('./src/v050/10b_a03_madame.js');
          console.log('keys',Object.keys(M));
          console.log('network keys',M.NETWORK_KEYS);
          console.log('projection keys',M.PROJECTION_KEYS);
          console.log('fresh',JSON.stringify(M.fresh(),null,2));
          NODE
