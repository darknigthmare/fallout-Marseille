name: Council integration

on:
  push:
    branches:
      - feature/conseil-regional-final
    paths:
      - '.github/workflows/conseil-audit.yml'
      - '.council-payload/**'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble source and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import zlib

          source=''.join(path.read_text(encoding='ascii') for path in sorted(Path('.council-payload').glob('src-*.b64')))
          tests=Path('.council-payload/test-00.b64').read_text(encoding='ascii')
          outputs={
              Path('src/v050/10c_conseil_regional.js'):zlib.decompress(base64.b64decode(source)),
              Path('tests/expansion/lore_conseil_regional.cjs'):zlib.decompress(base64.b64decode(tests)),
          }
          for path,data in outputs.items():
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
              print(f'wrote {path} ({len(data)} bytes)')
          PY
      - name: Validate council model and integration surface
        run: |
          node --check src/v050/10c_conseil_regional.js
          node --test tests/expansion/lore_conseil_regional.cjs
      - name: Commit integration and remove staging files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v050/10c_conseil_regional.js tests/expansion/lore_conseil_regional.cjs
          git rm -r .council-payload .github/workflows/conseil-audit.yml
          git commit -m 'feat(council): add playable regional ratification'
          git push origin HEAD:feature/conseil-regional-final
